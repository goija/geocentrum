<html lang="nl">
<head>

  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #1f6feb;
      --tag-bg: #21262d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 2rem 1.5rem;
      line-height: 1.5;
    }
    .container { max-width: 1280px; margin: 0 auto; }
    header {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    h1 { font-size: 1.8rem; color: #fff; }
    h1 span { color: var(--accent); font-weight: 400; font-size: 1.1rem; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      align-items: center;
    }
    input[type="search"] {
      flex: 1;
      min-width: 260px;
      padding: 0.65rem 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }
    input[type="search"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    button.filter-btn {
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.15s;
    }
    button.filter-btn:hover, button.filter-btn.active {
      background: var(--accent-hover);
      border-color: var(--accent);
      color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.12s, border-color 0.12s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      word-break: break-all;
      margin-bottom: 0.4rem;
      display: inline-block;
    }
    .card-title:hover { text-decoration: underline; }
    .card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      margin-bottom: 1rem;
      flex-grow: 1;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      padding-top: 0.75rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .badge {
      background: var(--tag-bg);
      padding: 0.2rem 0.55rem;
      border-radius: 12px;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .badge.private {
      border-color: #d29922;
      color: #e3b341;
    }
    .links a {
      color: var(--muted);
      text-decoration: none;
      margin-left: 0.6rem;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .links a:hover {
      color: #fff;
      border-color: var(--accent);
    }
  </style>
</head>

    const grid = document.getElementById('repo-grid');
    const searchInput = document.getElementById('search');
    const counter = document.getElementById('counter');
    let activeCat = 'all';

    function render() {
      const q = searchInput.value.toLowerCase();
      const filtered = repos.filter(r => {
        const matchesCat = activeCat === 'all' || r.cat === activeCat;
        const matchesSearch = r.name.toLowerCase().includes(q) ||
                              r.desc.toLowerCase().includes(q) ||
                              r.lang.toLowerCase().includes(q) ||
                              r.cat.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      counter.textContent = `(${filtered.length} van ${repos.length} repositories)`;
      grid.innerHTML = filtered.map(r => `
        <div class="card">
          <div>
            <a class="card-title" href="https://github.com/goija/${r.name}" target="_blank">${r.name}</a>
            <div class="card-desc">${r.desc || '<em>Geen beschrijving</em>'}</div>

              <a href="https://goija.github.io/${r.name}/" target="_blank" title="Open GitHub Pages indien actief">Pages ↗</a>
            </div>
          </div>
        </div>
      `).join('');
    }

    searchInput.addEventListener('input', render);

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = btn.dataset.cat;
        render();
      });
    });

    render();
